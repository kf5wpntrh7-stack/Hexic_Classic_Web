<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#9bd7f5">
<title>Hexic Classic Remake v6.1 Core</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app"><div class="frame">
<header class="top"><div class="stat"><span>Level</span><b id="level">1</b></div><div class="stat"><span>Score</span><b id="score">0</b></div><div class="stat"><span id="goalName">Combos To Go</span><b id="goal">8</b></div></header>
<section class="field">
<canvas id="game" width="720" height="720"></canvas><div id="toast" class="toast hidden"></div>
<div id="introLayer" class="overlay hidden"><div class="panel">
  <h2 id="introTitle">LEVEL 1</h2>
  <p id="levelText"></p>
  <button id="startBtn">開始本關</button>
</div></div>
<div id="menuLayer" class="overlay hidden"><div class="panel">
  <h2>暫停</h2><p style="font-size:14px;margin:0 0 8px">自然連鎖只會加分；只有你旋轉造成的第一波消除才會計入關卡目標。</p>
  <button id="continueBtn">繼續遊戲</button>
  <button id="undoMenuBtn">復原一步</button>
  <button id="restartBtn">重新開始本關</button>
  <button id="soundBtn">音效：開啟</button>
</div></div>
<div id="overLayer" class="overlay hidden"><div class="panel">
  <h2>GAME OVER</h2><p>炸彈倒數歸零。</p><button id="retryBtn">重新挑戰本關</button>
</div></div>
</section>
<footer class="bottom">
  <div class="rotwrap">
    <button id="leftRotateBtn" class="rotate rotate-left selected">↺</button>
    <div class="rotlabel">左旋轉</div>
  </div>
  <div class="rotwrap">
    <button id="rightRotateBtn" class="rotate rotate-right">↻</button>
    <div class="rotlabel">右旋轉</div>
  </div>
  <button id="menuBtn" class="menu">MENU</button>
</footer>
</div></div>
<script src="js/game.js"></script>
</body>
</html>
