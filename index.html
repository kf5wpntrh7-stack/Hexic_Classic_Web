<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071425"><title>Hexic Classic Web</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><header class="topbar"><div><div class="eyebrow">DORAYAKI STUDIO</div><h1>HEXIC CLASSIC</h1></div><button id="soundBtn" class="icon-btn">🔊</button></header><section class="stats"><div class="stat"><span>分數</span><strong id="score">0</strong></div><div class="stat"><span>最佳</span><strong id="best">0</strong></div><div class="stat"><span>連鎖</span><strong id="combo">0</strong></div></section><section class="game-shell"><canvas id="game" width="760" height="760"></canvas><div id="message" class="message hidden"></div></section><section class="controls"><button id="ccwBtn" class="control secondary">↶ 逆時針</button><button id="cwBtn" class="control primary">順時針 ↷</button></section><section class="actions"><button id="newBtn">新遊戲</button><button id="shuffleBtn">重新排列</button><button id="helpBtn">玩法說明</button></section><p class="hint">點一下三顆六角寶石的交界處選取，再按旋轉。電腦可雙擊順時針、右鍵逆時針。</p></main><dialog id="helpDialog"><div class="dialog-card"><h2>玩法說明</h2><p>選取共用同一個角落的三顆寶石並旋轉。三顆同色寶石在交界處相連時會消除，上方寶石會掉落並補入新寶石。</p><p>連續消除會提高連鎖分數。此版本支援手機與電腦。</p><button id="closeHelp" class="control primary">開始玩</button></div></dialog><script src="game.js"></script></body></html>
